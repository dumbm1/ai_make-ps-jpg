<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>make-output-preview</title>
 <link rel="stylesheet" href="assets/css/main.css">

 <style>
 </style>
</head>
<body>

<div class="page">

 <fieldset class="page__section">
  <legend>PS ДЛЯ СОГЛАСОВАНИЯ</legend>
  <div>
   <button class="btn" id="make_mail_ps">@-ps общий</button>
   <button class="btn" id="make_w_mail_ps">@-ps белая</button>
  </div>
  <!--  <div class="page__line-sep"></div>-->
 </fieldset>

 <fieldset class="page__section">
  <legend>PS ДЛЯ МОНТАЖА</legend>
  <div>
   <button class="btn" id="make_mount_ps">mount-ps общий</button>
   <button class="btn" id="make_w_mount_ps">mount-ps белая</button>
  </div>
  <!--  <div class="page__line-sep"></div>-->
 </fieldset>

 <fieldset class="page__section">
  <legend>ГЕНЕРАЦИЯ ДЖИПЕГОВ ИЗ PS</legend>
  <div>
   <button class="btn" id="make_jpg_from_ps">Сгенерировать джипеги</button>
  </div>

  <div class="number">
   <label for="jpg_quality">Качество общего</label>
   <input class="number__input" id="jpg_quality" type="number" max="12" min="1" step="1" value="10">
  </div>
  <div class="number">
   <label for="jpg_res">Разрешение общего</label>
   <input class="number__input" id="jpg_res" type="number" max="600" min="28" step="1" value="250">
   <label for="jpg_res">ppi</label>
  </div>
  <div class="number">
   <label for="w_jpg_quality">Качество белого</label>
   <input class="number__input" id="w_jpg_quality" type="number" max="12" min="1" step="1" value="6">
  </div>

  <div class="number">
   <label for="w_jpg_res">Разрешение белого</label>
   <input class="number__input" id="w_jpg_res" type="number" max="600" min="28" step="1" value="150">
   <label for="w_jpg_res">ppi</label>
  </div>
  <!--  <div class="page__line-sep"></div>-->
 </fieldset>

 <fieldset class="page__section">
  <legend>ПОМОЩНИК СЕПАРАЦИЙ</legend>
  <div>
   <button class="btn" id="make_sep">Сделать сепарации</button>
  </div>
  <!--  <div class="page__line-sep"></div>-->
 </fieldset>

 <footer class="footer">
  <div class="footer__buttons-string">
   <svg class="icon">
    <use href="assets/img/serviceIcon/iconSprite.svg#github"></use>
   </svg>
   <svg class="icon">
    <use href="assets/img/serviceIcon/iconSprite.svg#tooltip"></use>
   </svg>
   <button class="btn " id="reload_btn">Reload</button>
  </div>

  <div class="footer__info-string"><h3>info</h3>
   <span class="footer__info-string-span"></span>
  </div>
 </footer>

</div>

<script src="assets/js/CSInterface.js"></script>
<script src="assets/js/newCSInterface.js"></script>
<script src="assets/js/themeChanger.js"></script>
<script src="assets/js/fitPanelToContent.js"></script>
<script src="assets/js/reloadPanel.js"></script>

<script src="assets/js/common_lib.js"></script>

<script src="assets/js/printMount.js"></script>
<script src="assets/js/printWMount.js"></script>

<script src="assets/js/printMailPs.js"></script>
<script src="assets/js/printWMailPs.js"></script>

<script src="assets/js/makeJpgFromPs.js"></script>

<script src="assets/js/helpForSep.js"></script>

<script defer src="assets/js/main.js"></script>

</body>
</html>
